    .ty-account p { color: #666; font: 400 0.88rem/1.5 Inter, system-ui, sans-serif; margin: 0 0 1rem; }
    .ty-account input { width: 100%; box-sizing: border-box; padding: 0.7rem 0.9rem; border: 1.5px solid #ddd; border-radius: 10px; font: 400 0.92rem Inter, system-ui, sans-serif; margin-bottom: 0.65rem; }

<div class="ty-wrap">
  <div class="ty-card" id="ty-card">
    <div class="ty-icon">⏳</div>
    <h1 class="ty-title">Checking your order…</h1>
    <p class="ty-text">One moment.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-data.js"></script>
<script src="site-settings.js" defer></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var orderId = new URLSearchParams(location.search).get('order');
  var card = document.getElementById('ty-card');

  function render(o) {
    if (!o) {
      card.innerHTML = '<div class="ty-icon">🤔</div><h1 class="ty-title">Order not found</h1>' +
        '<p class="ty-text">If you just paid, it can take a minute to confirm. Refresh this page, or check your email.</p>' +
        '<a class="ty-cta" href="shop.html">Back to shop</a>';
      return;
    }
    if (o.status === 'paid') {
      try { localStorage.removeItem('shop_cart'); localStorage.removeItem('shop_last_order'); } catch (e) {}
      var dls = (o.downloads || []).map(function (d) {
        return '<div class="ty-dl"><span>' + d.title + '</span><a href="' + d.url + '">Download PDF</a></div>';
      }).join('');
      card.innerHTML = '<div class="ty-icon">🎉</div>' +
        '<h1 class="ty-title">Thank you! Payment received.</h1>' +
        '<p class="ty-text">We\'ve emailed your download links to <strong>' + (o.email || 'your inbox') + '</strong>. You can also grab them here:</p>' +
        '<div class="ty-downloads">' + (dls || '<p class="ty-text">Links are on their way to your email.</p>') + '</div>' +
        '<p class="ty-text">Signed-in members can re-download anytime from the dashboard.</p>' +
        '<a class="ty-cta" href="dashboard.html">Go to my dashboard</a>' +
        '<div id="ty-account-slot"></div>';
      renderAccountOffer(o);
    } else {
      card.innerHTML = '<div class="ty-icon">⌛</div><h1 class="ty-title">Payment is being confirmed</h1>' +
        '<div class="ty-pending">PayPal is still confirming this payment. This page will update automatically — ' +
        'your download links will also be emailed to you the moment it clears.</div>' +
        '<a class="ty-cta" href="shop.html">Continue shopping</a>';
    }
  }

  // Guest buyers (no account) only have the emailed receipt as a durable
  // copy of their download links. Offer to turn this order into an account
  // right here, so future purchases + redownloads land in their dashboard
  // instead of depending on a 7-day email link.
  function renderAccountOffer(o) {
    if (o.hasAccount || (window.auth && auth.currentUser)) return;
    var slot = document.getElementById('ty-account-slot');
    if (!slot) return;
    slot.innerHTML =
      '<div class="ty-account">' +
        '<h2>Save this order to an account</h2>' +
        '<p>Create a free password for <strong>' + (o.email || '') + '</strong> and this order (plus any future ones) will always be in your dashboard — no more hunting for the email.</p>' +
        '<input type="email" id="ty-acc-email" value="' + (o.email || '') + '" disabled />' +
        '<input type="password" id="ty-acc-pass" placeholder="Create a password (6+ characters)" autocomplete="new-password" />' +
        '<button id="ty-acc-btn" type="button">Create my account</button>' +
        '<p class="ty-account-error" id="ty-acc-error"></p>' +
      '</div>';
    document.getElementById('ty-acc-btn').addEventListener('click', function () { createAccountFromOrder(o); });
  }

  async function createAccountFromOrder(o) {
    var pass = document.getElementById('ty-acc-pass').value;
    var btn = document.getElementById('ty-acc-btn');
    var errEl = document.getElementById('ty-acc-error');
    errEl.style.display = 'none';
    if (!pass || pass.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.style.display = 'block';
      return;
    }
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      var cred = await auth.createUserWithEmailAndPassword(o.email, pass);
      if (o.name) await cred.user.updateProfile({ displayName: o.name });
      await GK.ensureUserRecord(cred.user, { displayName: o.name || '' });

      var idToken = await cred.user.getIdToken();
      await fetch('/api/claim-guest-orders', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + idToken }
      }).catch(function () {});

      // Make sure this buyer is in MailerLite even if the checkout-time
      // sync silently failed — account creation is a clear "we definitely
      // want this email" signal.
      fetch('/api/mailerlite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'purchase', email: o.email, name: o.name || '' })
      }).catch(function () {});

      document.getElementById('ty-account-slot').innerHTML =
        '<div class="ty-account-done">✅ Account created! This order (and any past guest orders under this email) are now in your dashboard.</div>';
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Create my account';
      errEl.textContent = (window.friendlyError ? friendlyError(err.code) : null) || 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
    }
  }

  if (!orderId) { render(null); return; }

  var tries = 0;
  function poll() {
    fetch('/api/order-status?order=' + encodeURIComponent(orderId))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        render(o);
        if (o && o.status !== 'paid' && tries++ < 20) setTimeout(poll, 4000);
      })
      .catch(function () { if (tries++ < 5) setTimeout(poll, 4000); else render(null); });
  }
  poll();
})();
</script>
