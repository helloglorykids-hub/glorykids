<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO:start -->
  <title>Thank You for Your Order | Glory Kids Ministries</title>
  <meta name="description" content="Your Glory Kids order confirmation and downloads." />
  <meta name="robots" content="noindex, nofollow" />
  <!-- SEO:end -->
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .ty-wrap { max-width: 640px; margin: 0 auto; padding: 4.5rem 1.5rem; }
    .ty-card { background: #fff; border: 1px solid #eee; border-radius: 18px; padding: 2.25rem; box-shadow: 0 10px 40px rgba(0,0,0,.06); text-align: center; }
    .ty-icon { font-size: 3rem; }
    .ty-title { font: 700 1.6rem/1.3 Poppins, system-ui, sans-serif; color: var(--navy, #1c2b3a); margin: 0.5rem 0; }
    .ty-text { color: #555; font: 400 1rem/1.6 Inter, system-ui, sans-serif; }
    .ty-downloads { margin: 1.5rem 0; display: grid; gap: 0.6rem; text-align: left; }
    .ty-dl { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.85rem 1.1rem; border: 1.5px solid var(--primary, #FF4B32); border-radius: 12px; }
    .ty-dl a { font: 600 0.9rem Inter, system-ui, sans-serif; color: #fff; background: var(--primary, #FF4B32); padding: 0.5rem 1rem; border-radius: 999px; text-decoration: none; white-space: nowrap; }
    .ty-pending { background: #FEF0D3; color: #9a6a00; border-radius: 12px; padding: 1rem; font: 500 0.9rem Inter, system-ui, sans-serif; }
    .ty-cta { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; border-radius: 999px; border: 1.5px solid var(--primary, #FF4B32); color: var(--primary, #FF4B32); text-decoration: none; font: 600 0.95rem Inter, system-ui, sans-serif; }
  </style>
  <!-- gk:managed:start -->
  <link rel="canonical" href="https://www.childrensministrylessons.com/shop-thankyou.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.childrensministrylessons.com/shop-thankyou.html">
  <meta name="twitter:card" content="summary">
  <!-- gk:managed:end -->
</head>
<body>
<nav class="nav" id="nav">
  <div class="container"><div class="nav__inner">
    <a href="index.html" class="nav__logo">
      <span class="nav__logo-star">⭐</span><div class="nav__logo-icon">✝</div>
      <span class="nav__logo-text">Glory <span>Kids</span> Ministries</span>
    </a>
  </div></div>
</nav>

<div class="ty-wrap">
  <div class="ty-card" id="ty-card">
    <div class="ty-icon">⏳</div>
    <h1 class="ty-title">Checking your order…</h1>
    <p class="ty-text">One moment.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-data.js"></script>
<script src="site-settings.js" defer></script>
<script src="app.js"></script>
<script>
(function () {
  var orderId = new URLSearchParams(location.search).get('order');
  var card = document.getElementById('ty-card');

  function render(o) {
    if (!o) {
      card.innerHTML = '<div class="ty-icon">🤔</div><h1 class="ty-title">Order not found</h1>' +
        '<p class="ty-text">If you just paid, it can take a minute to confirm. Refresh this page, or check your email.</p>' +
        '<a class="ty-cta" href="shop.html">Back to shop</a>';
      return;
    }
    if (o.status === 'paid') {
      try { localStorage.removeItem('shop_cart'); localStorage.removeItem('shop_last_order'); } catch (e) {}
      var dls = (o.downloads || []).map(function (d) {
        return '<div class="ty-dl"><span>' + d.title + '</span><a href="' + d.url + '">Download PDF</a></div>';
      }).join('');
      card.innerHTML = '<div class="ty-icon">🎉</div>' +
        '<h1 class="ty-title">Thank you! Payment received.</h1>' +
        '<p class="ty-text">We\'ve emailed your download links to <strong>' + (o.email || 'your inbox') + '</strong>. You can also grab them here:</p>' +
        '<div class="ty-downloads">' + (dls || '<p class="ty-text">Links are on their way to your email.</p>') + '</div>' +
        '<p class="ty-text">Signed-in members can re-download anytime from the dashboard.</p>' +
        '<a class="ty-cta" href="dashboard.html">Go to my dashboard</a>';
    } else {
      card.innerHTML = '<div class="ty-icon">⌛</div><h1 class="ty-title">Payment is being confirmed</h1>' +
        '<div class="ty-pending">PayFast is still confirming this payment. This page will update automatically — ' +
        'your download links will also be emailed to you the moment it clears.</div>' +
        '<a class="ty-cta" href="shop.html">Continue shopping</a>';
    }
  }

  if (!orderId) { render(null); return; }

  var tries = 0;
  function poll() {
    fetch('/api/order-status?order=' + encodeURIComponent(orderId))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        render(o);
        if (o && o.status !== 'paid' && tries++ < 20) setTimeout(poll, 4000);
      })
      .catch(function () { if (tries++ < 5) setTimeout(poll, 4000); else render(null); });
  }
  poll();
})();
</script>
</body>
</html>
