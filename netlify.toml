# Netlify configuration — hand-maintained (build.js does NOT touch this file).
# build.js writes _redirects and _headers, which Netlify merges with the rules here.

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  # The Firebase *Web* API key (AIzaSy...) is a public client identifier, not a
  # secret — it ships in every Firebase web app's JS by design. Security is
  # enforced by Firestore/Storage rules (and, optionally, API-key referrer
  # restrictions + App Check). Tell Netlify's secret scanner it is expected.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBkGSjwewBHTwf1SSNb7hbNkLaD89X-onk"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────
# Caching. Netlify's default is must-revalidate on everything, so
# every repeat visit re-checks each file. These let the browser
# reuse assets without a round-trip. HTML is still always fresh.
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"   # 30 days

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"  # 1 day, refresh in bg for a week

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

